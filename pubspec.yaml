name: edify
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  google_sign_in: ^6.2.1
  flutter_launcher_icons: ^0.14.4
  firebase_database: ^11.0.0
  intl: ^0.20.2
  percent_indicator: ^4.2.3
  file_picker: ^8.0.0
  url_launcher: ^6.2.5
  path_provider: ^2.1.2
  fl_chart: ^0.66.0
  flutter_slidable: ^3.0.0
  image_picker: ^1.0.7
  firebase_storage: ^12.1.0
  google_generative_ai: ^0.4.7
  lottie: ^3.1.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/unimate_final.png
    - assets/animations/study.json

# ✨ FINAL ADAPTIVE ICON FIX (VehicleCare Style)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/unimate_final.png"

  # Background color jo aapke logo ke piche fill hoga
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icons/unimate_final.png"


  adaptive_icon_foreground_inset: 0

  web:
    generate: true
    image_path: "assets/icons/unimate_final.png"
    background_color: "#0F172A"
    theme_color: "#0F172A"